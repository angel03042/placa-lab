<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-labelledby="title desc">
  <title id="title">Tarjeta gráfica PCI Express de dos ventiladores</title>
  <desc id="desc">La escuadra de metal lleva las salidas de vídeo y la tarjeta muestra el borde dorado que encaja en la ranura.</desc>
  <defs>
    <linearGradient id="metal" x2=".9" y2="1">
      <stop stop-color="#d4dcd1"/><stop offset=".5" stop-color="#a8b9b1"/><stop offset="1" stop-color="#7c918c"/>
    </linearGradient>
    <linearGradient id="blade" x2="1" y2=".8">
      <stop stop-color="#869396"/><stop offset=".55" stop-color="#5b6b70"/><stop offset="1" stop-color="#405359"/>
    </linearGradient>
    <path id="vane" d="M-3-8C-6-12-7-17-5-23c1-6 5-11 8-13 7 0 13 3 17 8-10 1-18 9-19 20z"/>
    <g id="fan">
      <circle r="40" fill="#212f34" stroke="#64767a" stroke-width="2.5"/>
      <circle r="35.5" fill="#293b3e"/>
      <g fill="url(#blade)" stroke="#33464b" stroke-width=".7">
        <use href="#vane"/><use href="#vane" transform="rotate(40)"/><use href="#vane" transform="rotate(80)"/>
        <use href="#vane" transform="rotate(120)"/><use href="#vane" transform="rotate(160)"/>
        <use href="#vane" transform="rotate(200)"/><use href="#vane" transform="rotate(240)"/>
        <use href="#vane" transform="rotate(280)"/><use href="#vane" transform="rotate(320)"/>
      </g>
      <circle r="11" fill="#3b4c50" stroke="#2a3c3e"/><circle r="7.7" fill="url(#metal)"/>
      <path d="m-3 2 3-5h3L0 2z" fill="#788e89"/>
    </g>
    <pattern id="fingers" width="4" height="13" patternUnits="userSpaceOnUse">
      <path fill="#d2b372" d="M.4 0h2.8v13H.4z"/>
    </pattern>
    <pattern id="fins" width="4" height="5" patternUnits="userSpaceOnUse">
      <path fill="#a5b3ac" d="M0 0h1.5v5H0z"/>
    </pattern>
  </defs>
  <g transform="matrix(.98,.125,-.08,.91,62,28)" stroke-linejoin="round">
    <path fill="#718783" stroke="#627672" d="M8 0 -2 5v115l10 5 3-5 1-114z"/>
    <path fill="url(#metal)" stroke="#697e7b" d="M8-3 28-12l2 4L14 0v115l-8 6-3-2 5-8z"/>
    <path fill="#2b4940" stroke="#375347" d="M14 13h218l6 7v82l-4 3H152v12h-13v-9h-5v9H61v-9h-4v9H35v-16H14z"/>
    <path fill="url(#fingers)" d="M35 105h22v12H35zm26 0h73v12H61z"/>
    <path fill="#35484b" stroke="#263a3b" d="M12 4 29-4h200l16 13-3 77-12 9H21L11 82Z"/>
    <path fill="url(#fins)" d="M21 5 33 0h194l13 10H27z"/>
    <path fill="#71817f" d="m14 11 13-7h199l10 9-7 6H18z"/>
    <path fill="#39494c" stroke="#283b3d" stroke-width="1.2" d="M14 13h207l13 10v60l-12 12H20l-9-10V23z"/>
    <path fill="#58686a" d="m18 18 23-1-14 14v29l-10 9V25zm188 3 15-1 9 8v39l-9-11V33z"/>
    <path fill="#33464b" d="m94 84 18-29v-7l9-15-3-9h10l5 11-8 21v8l-14 20z"/>
    <use href="#fan" transform="translate(67 54)"/><use href="#fan" transform="translate(170 54)"/>
    <g fill="#9daaa6" stroke="#405453" stroke-width="1">
      <circle cx="18" cy="22" r="2.2"/><circle cx="18" cy="84" r="2.2"/>
      <circle cx="220" cy="24" r="2.2"/><circle cx="221" cy="84" r="2.2"/>
    </g>
    <path fill="#a4b7ae" stroke="#697f78" d="M8 1-11 10v103l18-9 2-11V5z"/>
    <g fill="#33464a" stroke="#d5d9c3" stroke-width=".8">
      <path d="m-8 19 12-6v9l-3 3-9 4z"/><path d="m-8 36 12-6v9l-3 3-9 4z"/>
      <path d="m-8 54 12-6v8l-3 4-7 3-2-2z"/>
    </g>
    <path stroke="#607773" stroke-width="2" d="m-7 73 9-4m-9 10 9-4m-9 10 9-4m-9 10 9-4"/>
